services:
    postgres:
        image: postgres:18
        environment:
            POSTGRES_USER: quard
            POSTGRES_PASSWORD: quard
            POSTGRES_DB: quard
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U quard -d quard"]
            interval: 5s
            timeout: 3s
            retries: 10

    migrate:
        build: .
        command: ["pnpm", "--filter", "@quard/db", "migrate"]
        environment:
            DATABASE_URL: postgres://quard:quard@postgres:5432/quard
        depends_on:
            postgres:
                condition: service_healthy

    webhook:
        build:
            context: .
            args:
                SERVICE: webhook
        environment:
            PORT: "4100"
            DATABASE_URL: postgres://quard:quard@postgres:5432/quard
            # 64 hex characters, the same in every agent process
            QUARD_HASH_KEY: ${QUARD_HASH_KEY:-}
        ports:
            - "4100:4100"
        depends_on:
            migrate:
                condition: service_completed_successfully

    control:
        build:
            context: .
            args:
                SERVICE: control
        environment:
            PORT: "4200"
            DATABASE_URL: postgres://quard:quard@postgres:5432/quard
            # 64 hex characters, the same in every agent process
            QUARD_HASH_KEY: ${QUARD_HASH_KEY:-}
        ports:
            - "4200:4200"
        depends_on:
            migrate:
                condition: service_completed_successfully

    worker:
        build:
            context: .
            args:
                SERVICE: worker
        environment:
            DATABASE_URL: postgres://quard:quard@postgres:5432/quard
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        depends_on:
            migrate:
                condition: service_completed_successfully

volumes:
    postgres-data:
