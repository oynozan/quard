packages:
    - db
    - docs
    - packages/*
    - sandbox
    - services/*
    - web

catalog:
    "@electric-sql/pglite": 0.5.8
    "@electric-sql/pglite-socket": 0.2.11
    "@eslint/js": 10.0.1
    "@hono/node-server": 2.1.3
    "@modelcontextprotocol/sdk": 1.32.0
    "@openai/agents": 0.18.0
    "@types/node": ^24.0.0
    "@types/pg": 8.23.1
    "@types/ws": 8.18.2
    "@vitest/coverage-v8": 5.0.3
    "@x402/core": 2.28.0
    "@x402/fetch": 2.28.0
    "@x402/mcp": 2.28.0
    eslint: 10.12.0
    hono: 4.13.12
    kysely: 0.29.6
    openai: 7.27.0
    pg: 8.23.1
    prettier: 3.9.9
    tldts: 7.4.16
    tsdown: 0.23.0
    typescript: 6.0.3
    typescript-eslint: 8.71.0
    vitest: 5.0.3
    ws: 8.22.0
    zod: 4.6.5

allowBuilds:
    "@reown/appkit": false
    bufferutil: false
    keccak: false
    sharp: false
    unrs-resolver: false
    utf-8-validate: false

minimumReleaseAgeExclude:
    - eslint@10.12.0

# Nextra 4.6.1 needs zod below 4.4: newer zod rejects its Layout props
overrides:
    "nextra>zod": 4.3.6
    "nextra-theme-docs>zod": 4.3.6
